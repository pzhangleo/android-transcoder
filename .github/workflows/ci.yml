name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same PR supersedes the previous run. Without this, an
# expensive x265 build keeps a runner busy for a commit nobody looks at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Cheap gate before any Gradle work: a tampered or truncated wrapper jar is a
  # supply-chain problem, and the check costs seconds.
  wrapper:
    name: Gradle wrapper validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  lib:
    name: lib (assemble / unit tests / lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble, test and lint
        run: >
          ./gradlew
          :lib:assembleDebug
          :lib:testDebugUnitTest
          :lib:lintDebug
          --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lib-reports
          path: |
            lib/build/reports/**
            lib/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  # The NDK install and the x265 compile dominate CI time, so the native module
  # and the sample app share one job and one Gradle cache.
  native:
    name: native-h265 + example (x265 from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install SDK platform, CMake and NDK
        # `set -e` without `pipefail` on purpose: `yes` gets SIGPIPE when
        # sdkmanager finishes, and pipefail would turn that into a failure.
        run: |
          set -eu
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          # sdkmanager is not on PATH on every runner image and its location has
          # moved between image generations, so look it up instead of assuming.
          sdkmanager=$(ls -1 "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager not found under $sdk/cmdline-tools"
            ls -R "$sdk/cmdline-tools" 2>/dev/null | head -30
            exit 1
          fi
          echo "sdk=$sdk"
          echo "sdkmanager=$sdkmanager"
          # These versions are pinned in build.gradle; keep them in sync.
          yes | "$sdkmanager" --sdk_root="$sdk" --install \
            "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.0.12077973" \
            > "$RUNNER_TEMP/sdkmanager.log" 2>&1 || {
              tail -40 "$RUNNER_TEMP/sdkmanager.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/sdkmanager.log"
          test -d "$sdk/ndk/27.0.12077973" || {
            echo "::error::NDK 27.0.12077973 was not installed"; exit 1; }

      - name: Build x265, run native unit tests, assemble the sample app
        run: >
          ./gradlew
          :native-h265:testDebugUnitTest
          :native-h265:assembleDebug
          :example:assembleDebug
          --stacktrace

      - name: Verify the packaged native library
        run: |
          set -euo pipefail
          apk=$(echo example/build/outputs/apk/debug/*.apk)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libnative_h265.so' \
            || { echo "::error::arm64-v8a libnative_h265.so missing from the APK"; exit 1; }
          # The library must not silently depend on the C++ shared runtime: every
          # consumer would then need to ship it, and the example app does not.
          so=$(find native-h265/build -path '*arm64-v8a*' -name libnative_h265.so | head -1)
          if readelf -d "$so" | grep -q 'libc++_shared.so'; then
            echo "::error::$so links against libc++_shared.so"
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-reports
          path: |
            native-h265/build/reports/**
            native-h265/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: example-debug-apk
          path: example/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
